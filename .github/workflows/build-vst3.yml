name: Build Windows VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          $src = "build\JerzyAudioQuantizer_artefacts\Release\VST3\JERZY AUDIO QUANTIZER.vst3"
          if (-not (Test-Path $src)) { throw "VST3 output not found: $src" }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse -Force $src package\

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: JerzyAudioQuantizer-Windows-VST3
          path: package/
          if-no-files-found: error
          compression-level: 9
